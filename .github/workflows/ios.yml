#
# NoDrive for iOS: branding gate, simulator build of the app and all extensions,
# unit tests on the simulator, and a simulator job that installs, launches and
# screenshots every screen reachable before sign-in (en, de, ar, dark) with a
# network check. No secrets, no signing (CODE_SIGNING_ALLOWED=NO), and no contact
# with the real drive.nourax.org (a local stand-in answers for it in the screens job).
# Upstream's workflows are kept for reference in .github/upstream-workflows/.

name: iOS

on:
  push:
    branches:
      - main
      - platform/ios
      - feature/workspace-apps
      - feature/workspace-apps-fixes
      - feature/smart-conflicts
      - feature/problem-reports
  workflow_dispatch:
    inputs:
      products_run_id:
        description: 'Run only the screens job with the build products of this earlier run (empty: full build)'
        required: false
        default: ''
        type: string
      only_workspace:
        description: 'Screens job: run only the Workspace apps UI test (not the four screenshot walks)'
        required: false
        default: false
        type: boolean
      only_reports:
        description: 'Screens job: run only the problem-reports UI test (not the walks or the Workspace test)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail

env:
  PROJECT: Nextcloud.xcodeproj
  SCHEME: Nextcloud
  # The project needs Xcode 27 (iOS 27 SDK; BackgroundUploadExtension targets iOS 27).
  # macos-latest (macOS 26) only has Xcode 26.x, so the build runs on GitHub's
  # hosted "xcode-27" image, as upstream does.
  XCODE_APP: /Applications/Xcode_27.1.app
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
  # Swift packages must sit in DerivedData/SourcePackages (Xcode's default for
  # -derivedDataPath DerivedData): BackgroundUploadExtension's HEADER_SEARCH_PATHS
  # point at $(BUILD_DIR)/../../SourcePackages/checkouts/...
  SPM_DIR: DerivedData/SourcePackages

jobs:
  branding:
    name: Branding gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow (for make-icons --check)
        run: python -m pip install --disable-pip-version-check pillow

      - name: rebrand.py --check (the tree is fully rebranded)
        run: python tools/rebrand.py --check

      - name: make-icons.py --check (icons come from the Nourax logo)
        run: python tools/make-icons.py --check

      - name: check-branding.py (no unclassified Nextcloud strings in the source)
        run: python tools/check-branding.py

      - name: The UI-test account code exists in Debug builds only
        run: python tools/ci/workspace-check.py --debug-only iOSClient/Workspace/NCUITestAccount.swift

      - name: The Workspace checks can fail (each broken log must be caught)
        run: python tools/ci/workspace-check.py --self-test

      - name: The problem-report test hooks exist in Debug builds only
        run: python tools/ci/workspace-check.py --debug-only iOSClient/ProblemReports/NCProblemReportUITestHooks.swift

      - name: The problem-report checks can fail (each broken run must be caught)
        run: python tools/ci/report-check.py --self-test

  server-login:
    name: Server login (a real Nextcloud 35 in Docker; the app's web view sign-in)
    needs: branding
    # ubuntu-24.04, not ubuntu-latest (26.04): Playwright 1.55 does not support the newer image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Start the throwaway server (Nextcloud 35.0.2 in Docker, never drive.nourax.org)
        run: bash tools/ci/server-app-login.sh start

      - name: Install Playwright (the runner's Chrome is used; no browser download)
        run: python -m pip install --disable-pip-version-check playwright==1.55.0

      - name: Check how the app's sign-in works against the real server code
        run: bash tools/ci/server-app-login.sh check

      - name: Problem reports server checks (the folder, never replacing a report, the read-only share to nourax-support)
        if: ${{ !cancelled() }}
        run: bash tools/ci/server-app-login.sh reports

      - name: Stop the server
        if: ${{ always() }}
        run: |
          bash tools/ci/server-app-login.sh stop
          rm -f build/server-login/server.env

      - name: Upload the server-login report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-login-report
          path: |
            build/server-login/report.md
            build/server-login/reports.md
            build/server-login/status.json
            build/server-login/navigation-apps-*.json
            build/server-login/webview-ua-primary.png
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Build and unit tests (iOS Simulator)
    needs: branding
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.products_run_id == '' }}
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -E "iPhone 17 " || true

      - name: Check xcodebuild options used below
        run: |
          xcodebuild -help > xcodebuild-help.txt 2>&1 || true
          for opt in -resolvePackageDependencies -clonedSourcePackagesDirPath -disableAutomaticPackageResolution \
                     -derivedDataPath -resultBundlePath -only-testing -xctestrun -xcconfig -enableThreadSanitizer -enableCodeCoverage; do
            if grep -q -- "$opt" xcodebuild-help.txt; then echo "ok   $opt"; else echo "MISSING $opt"; exit 1; fi
          done

      - name: Restore Swift packages cache
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-xcode27-${{ hashFiles('Nextcloud.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages (from Package.resolved only)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution

      - name: Save Swift packages cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Validate project file
        run: |
          plutil -lint "$PROJECT/project.pbxproj"
          xcodebuild -list -project "$PROJECT" -clonedSourcePackagesDirPath "$SPM_DIR" -disableAutomaticPackageResolution

      - name: Simulated entitlements (no signing)
        # Without signing the simulator gives the app no app group and no keychain group
        # (run 40157259840: "App Group container URL not found", OSStatus -34018). Xcode's
        # own simulator builds link the entitlements into the binary as Mach-O sections;
        # this does the same through an -xcconfig file. See the tool's docstring.
        run: |
          python3 tools/ci/simulated-entitlements.py "$RUNNER_TEMP/sim-entitlements"
          echo "SIM_ENTS=$RUNNER_TEMP/sim-entitlements" >> "$GITHUB_ENV"
          mkdir -p results/simulated-entitlements
          cp "$RUNNER_TEMP"/sim-entitlements/* results/simulated-entitlements/

      - name: Build app, all extensions and test bundles (iphonesimulator, unsigned)
        id: build
        # The scheme's test action turns on Thread Sanitizer; -enableThreadSanitizer NO
        # alone did not switch it off (run 40156412030), so the build setting is set too.
        run: |
          mkdir -p results
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution \
            -xcconfig "$SIM_ENTS/simulated-entitlements.xcconfig" \
            -enableThreadSanitizer NO -enableCodeCoverage NO \
            ENABLE_THREAD_SANITIZER=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee results/build.log | xcbeautify --quieter --renderer github-actions
          echo "Thread Sanitizer objects in the build (expected 0): $(grep -c 'Objects-normal-tsan' results/build.log || true)"

      - name: Package the simulator app (NoDrive.app)
        run: |
          mkdir -p package
          ditto DerivedData/Build/Products/Debug-iphonesimulator/Nextcloud.app package/NoDrive.app
          # build-for-testing puts the unit-test bundles into the host app; they do not ship
          echo "removing test bundles:"; ls -d package/NoDrive.app/PlugIns/*.xctest || true
          rm -rf package/NoDrive.app/PlugIns/*.xctest
          cd package
          ditto -c -k --sequesterRsrc --keepParent NoDrive.app ../nodrive-ios-simulator-app.zip
          ls -l ../nodrive-ios-simulator-app.zip
          echo "sanitizer runtimes in the bundle (expected none):"
          find NoDrive.app -name "libclang_rt.*" -print

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-ios-simulator-app
          path: nodrive-ios-simulator-app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Pack build products for the screens job (app, UI-test runner, .xctestrun)
        # tar keeps symlinks and file modes (an artifact zip does not)
        run: |
          cd DerivedData/Build
          du -sh Products/Debug-iphonesimulator/* 2>/dev/null | sort -h | tail -n 20
          tar --exclude='*.swiftmodule' --exclude='*.dSYM' --exclude='*.a' --exclude='include' \
            -czf "$GITHUB_WORKSPACE/build-products.tar.gz" Products/*.xctestrun Products/Debug-iphonesimulator
          ls -l "$GITHUB_WORKSPACE/build-products.tar.gz"

      - name: Upload build products (screens job input, kept 3 days)
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-ios-build-products
          path: build-products.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Inspect built products (ids, names, URL schemes, entitlements, Nextcloud links)
        run: |
          APP=package/NoDrive.app   # the shipped artifact (test bundles removed)
          {
            for p in "$APP/Info.plist" "$APP"/PlugIns/*.appex/Info.plist "$APP"/Extensions/*.appex/Info.plist; do
              echo "=== $p"; plutil -p "$p"
            done
            echo "=== entitlement files written by the build (.xcent)"
            find DerivedData/Build/Intermediates.noindex -name "*.xcent" -print -exec plutil -p {} \; 2>/dev/null || true
          } > results/products-plists.txt
          python3 tools/ci/inspect-products.py "$APP" --json results/products.json | tee results/products.txt

      - name: Branding sweep of the built app (report)
        continue-on-error: true
        run: |
          python3 tools/check-branding.py --app package/NoDrive.app \
            --json results/check-branding-app.json > results/check-branding-app.txt 2>&1
        # report only in the build stage; the sweep stage turns this into a gate

      - name: Show app sweep summary
        if: ${{ !cancelled() }}
        run: tail -n 3 results/check-branding-app.txt || true

      - name: Unit tests on the simulator
        # also runs when the product inspection above reports a problem
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          XCTESTRUN=$(find DerivedData/Build/Products -maxdepth 1 -name "*.xctestrun" | head -n 1)
          echo "xctestrun: $XCTESTRUN"
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:NextcloudUnitTests \
            -resultBundlePath results/unit-tests.xcresult \
            2>&1 | tee results/unit-tests.log | xcbeautify --renderer github-actions

      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          if [ -d results/unit-tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path results/unit-tests.xcresult > results/unit-tests-summary.json || true
            head -c 3000 results/unit-tests-summary.json || true
          fi

      - name: Upload test results and build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-ios-test-results
          path: results/
          if-no-files-found: warn
          retention-days: 14

  screens:
    name: Simulator screens (install, launch, screenshots, network)
    needs: [branding, ios]
    # also after a unit-test failure (the build products exist), or with products of an earlier run
    if: ${{ !cancelled() && needs.branding.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'failure' || (needs.ios.result == 'skipped' && inputs.products_run_id != '')) }}
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read   # download-artifact from an earlier run (products_run_id)
    env:
      SHOTS: ${{ github.workspace }}/screenshots
      RESULTS: ${{ github.workspace }}/results
      IOS_VERSION: '27.0'
      SIGN_IN: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow (screenshot report)
        run: python -m pip install --disable-pip-version-check pillow

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Check the simctl, xcodebuild and xcresulttool options used below
        run: bash tools/ci/screens.sh check-tools "$RESULTS/tool-help"

      - name: Download build products (this run)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.products_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: nodrive-ios-build-products
          path: artifacts/products

      - name: Download simulator app (this run)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.products_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: nodrive-ios-simulator-app
          path: artifacts/app

      - name: Download build products (earlier run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.products_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: nodrive-ios-build-products
          path: artifacts/products
          github-token: ${{ github.token }}
          run-id: ${{ inputs.products_run_id }}

      - name: Download simulator app (earlier run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.products_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: nodrive-ios-simulator-app
          path: artifacts/app
          github-token: ${{ github.token }}
          run-id: ${{ inputs.products_run_id }}

      - name: Unpack app and build products
        run: |
          mkdir -p products app "$SHOTS" "$RESULTS"
          tar -xzf artifacts/products/build-products.tar.gz -C products
          ditto -x -k artifacts/app/nodrive-ios-simulator-app.zip app
          ls products/Products products/Products/Debug-iphonesimulator app
          XCTESTRUN=$(find "$GITHUB_WORKSPACE/products/Products" -maxdepth 1 -name "*.xctestrun" | head -n 1)
          echo "xctestrun: $XCTESTRUN"
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"
          plutil -p "$XCTESTRUN" | grep -E '"(BlueprintName|TestHostPath|UITargetAppPath|ProductModuleName)"' | sort -u

      - name: Start DNS capture on all interfaces
        run: bash tools/ci/screens.sh capture-start "$RESULTS"

      - name: Start the local stand-in for drive.nourax.org (the real server is never contacted)
        # drive.nourax.org -> 127.0.0.1/::1 in /etc/hosts (the simulator resolves through the Mac),
        # a throw-away root that only this simulator trusts, and tools/ci/drive-stand-in.py on :443
        run: |
          SI="$RUNNER_TEMP/stand-in"
          bash tools/ci/screens.sh make-certs "$SI"
          echo "CA_CER=$SI/ca.cer" >> "$GITHUB_ENV"
          cp "$SI/ca.pem" "$RESULTS/stand-in-root.pem"
          printf '127.0.0.1 drive.nourax.org\n::1 drive.nourax.org\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
          # A throwaway app password for the stand-in's test account (never printed, never on a command line;
          # the stand-in and the UI test read it from the environment).
          WS_PW=$(openssl rand -hex 16)
          echo "::add-mask::$WS_PW"
          echo "NODRIVE_WS_USER=citest" >> "$GITHUB_ENV"
          echo "NODRIVE_WS_APP_PASSWORD=$WS_PW" >> "$GITHUB_ENV"
          export NODRIVE_WS_USER=citest NODRIVE_WS_APP_PASSWORD="$WS_PW"
          printf '127.0.0.1 foreign.nodrive-ci.test\n::1 foreign.nodrive-ci.test\n' | sudo tee -a /etc/hosts
          sudo -E nohup "$(command -v python3)" tools/ci/drive-stand-in.py --cert "$SI/chain.pem" --key "$SI/leaf.key" \
            --log "$RESULTS/stand-in.jsonl" --workspace --nav-delay 6 \
            --reports-uploads "$RESULTS/stand-in-uploads" > "$RESULTS/stand-in.out" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS --cacert "$SI/ca.pem" -o /dev/null https://drive.nourax.org/status.php && break
            sleep 0.5
          done
          curl -fsS --cacert "$SI/ca.pem" https://drive.nourax.org/status.php; echo
          dscacheutil -q host -a name drive.nourax.org
          security verify-cert -c "$SI/leaf.pem" -r "$SI/ca.pem" -p ssl -s drive.nourax.org \
            || echo "(report only; options: results/tool-help/security-verify-cert.txt)"

      - name: Pick the simulator (iPhone 17, iOS 27.0)
        id: sim
        run: |
          UDID=$(bash tools/ci/screens.sh device)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: simctl install, launch and screenshots (shipped NoDrive.app)
        run: |
          bash tools/ci/screens.sh prepare-first "$UDID"
          if [ "${{ inputs.only_workspace }}" != "true" ] && [ "${{ inputs.only_reports }}" != "true" ]; then
            bash tools/ci/screens.sh switch "$UDID" en en_US light
            bash tools/ci/screens.sh launch "$UDID" app/NoDrive.app "$SHOTS/simctl" "$RESULTS"
          fi

      - name: UI walk, English (en-light)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true && inputs.only_reports != true }}
        run: |
          bash tools/ci/screens.sh switch "$UDID" en en_US light
          bash tools/ci/screens.sh walk "$UDID" en-light en en_US

      - name: UI walk, German (de-light)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true && inputs.only_reports != true }}
        run: |
          bash tools/ci/screens.sh switch "$UDID" de de_DE light
          bash tools/ci/screens.sh walk "$UDID" de-light de de_DE

      - name: UI walk, Arabic right-to-left (ar-light)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true && inputs.only_reports != true }}
        run: |
          bash tools/ci/screens.sh switch "$UDID" ar ar_SA light
          bash tools/ci/screens.sh walk "$UDID" ar-light ar ar_SA

      - name: UI walk, English dark mode (en-dark)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true && inputs.only_reports != true }}
        run: |
          bash tools/ci/screens.sh switch "$UDID" en en_US dark
          bash tools/ci/screens.sh walk "$UDID" en-dark en en_US

      - name: Workspace apps menu, signed in (light)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_reports != true }}
        run: |
          # a clean simulator: the account of an earlier run is in the keychain and the app group
          bash tools/ci/screens.sh prepare-first "$UDID"
          bash tools/ci/screens.sh switch "$UDID" en en_US light
          bash tools/ci/screens.sh workspace "$UDID" workspace-light

      - name: Workspace apps menu, signed in (dark)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_reports != true }}
        run: |
          # a clean simulator: the account of an earlier run is in the keychain and the app group
          bash tools/ci/screens.sh prepare-first "$UDID"
          bash tools/ci/screens.sh switch "$UDID" en en_US dark
          bash tools/ci/screens.sh workspace "$UDID" workspace-dark

      - name: Workspace checks (credential only to the own server, no login page, no stale sessions, expiry)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_reports != true }}
        run: |
          python3 tools/ci/workspace-check.py "$RESULTS/stand-in.jsonl" --walk "$SHOTS" --json "$RESULTS/workspace-check.json"

      - name: Problem reports, signed in (light)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true }}
        run: |
          # a clean simulator: the account of an earlier run is in the keychain and the app group
          bash tools/ci/screens.sh prepare-first "$UDID"
          bash tools/ci/screens.sh switch "$UDID" en en_US light
          bash tools/ci/screens.sh reports "$UDID" reports-light

      - name: Problem reports, signed in (dark)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true }}
        run: |
          bash tools/ci/screens.sh prepare-first "$UDID"
          bash tools/ci/screens.sh switch "$UDID" en en_US dark
          bash tools/ci/screens.sh reports "$UDID" reports-dark

      - name: Problem reports check (kinds, order, headers, shares, sizes, no secret in a zip)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true }}
        run: |
          python3 tools/ci/report-check.py --log "$RESULTS/stand-in.jsonl" --uploads "$RESULTS/stand-in-uploads" \
            --variants reports-light reports-dark --walk "$SHOTS" --json "$RESULTS/report-check.json"

      - name: Network gate (no Nextcloud hosts; sign-in opened drive.nourax.org)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && inputs.only_workspace != true && inputs.only_reports != true }}
        run: |
          bash tools/ci/screens.sh capture-stop "$RESULTS"
          python3 tools/ci/network-gate.py --dns-text "$RESULTS/dns.txt" --dns-processes "$RESULTS/dns-processes.txt" \
            --stand-in-log "$RESULTS/stand-in.jsonl" \
            --expect-sign-ins 4 --control www.apple.com --json "$RESULTS/network.json"

      - name: Screenshot report (Nourax colours, no Nextcloud text) and docs copies
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: |
          python3 tools/ci/screens-report.py --shots "$SHOTS" --results "$RESULTS" \
            --variants ${{ inputs.only_reports == true && 'reports-light reports-dark' || inputs.only_workspace == true && 'workspace-light workspace-dark' || 'en-light de-light ar-light en-dark workspace-light workspace-dark reports-light reports-dark' }} \
            --docs-out "$GITHUB_WORKSPACE/screenshots-docs" --json "$RESULTS/screens-report.json"

      - name: No throwaway password in any result file
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: python3 tools/ci/workspace-check.py --scan-secret "$RESULTS" "$SHOTS" "$GITHUB_WORKSPACE/screenshots-docs"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-ios-screenshots
          path: |
            screenshots/
            screenshots-docs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screens results (logs, xcresult, network capture summary)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-ios-screens-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
